# ==========================================
# Application Configuration
# ==========================================
spring.application.name=University
server.port=${SERVER_PORT:8081}

# ==========================================
# Database Connection (PostgreSQL)
# Supports Environment Variables for Docker
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/university_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JWT (JSON Web Token) Security Settings
# ==========================================
# 256-bit secret key for HS256 algorithm
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity: 24 Hours in milliseconds (86400000 ms)
app.jwt.expiration-ms=86400000
